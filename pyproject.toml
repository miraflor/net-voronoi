[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoronoi"
version = "0.4.3"
description = "Network-distance Voronoi and additive-epsilon Voronoi regions on spatial networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "James Matthew Miraflor"}]
dependencies = [
  "geopandas>=1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyogrio>=0.9",
  "scipy>=1.11",
  "shapely>=2.0",
  "spaghetti>=1.7.6,<2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netvoronoi = "netvoronoi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

