[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netvoronoi"
version = "0.2.0"
description = "Cluster-based Voronoi regions informed by shortest-path distance on spatial networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "James Matthew Miraflor"}]
dependencies = [
  "geopandas>=1.0",
  "numpy>=1.26",
  "pyogrio>=0.9",
  "scipy>=1.11",
  "shapely>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
parquet = ["pyarrow>=14"]

[project.scripts]
netvoronoi = "netvoronoi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
