<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Snap ambiguity counts distinct network locations; geometric crossings without shared vertices are not graph junctions.</title>
<desc id="desc">Snap ambiguity counts distinct network locations; geometric crossings without shared vertices are not graph junctions.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#2d3436}
.small{font-size:14px} .label{font-size:16px;font-weight:600} .tiny{font-size:12px;fill:#65757c}
.road{stroke:#66757c;stroke-width:10;stroke-linecap:round;fill:none}
.thin{stroke:#66757c;stroke-width:3;fill:none} .dash{stroke-dasharray:7 6}
.node{stroke:#fff;stroke-width:2}
</style>

<text x="48" y="42" class="label">Topology is literal: shared vertices connect roads; geometric crossings do not</text>
<rect x="50" y="80" width="370" height="350" rx="7" fill="#fbfcfc" stroke="#dfe5e8"/>
<text x="76" y="112" class="label">Shared junction</text>
<line x1="110" y1="260" x2="360" y2="260" class="road"/>
<line x1="235" y1="150" x2="235" y2="365" class="road"/>
<circle cx="235" cy="260" r="9" fill="#2d3436" class="node"/>
<circle cx="274" cy="213" r="8" fill="#2e86de" opacity=".35"/>
<line x1="274" y1="213" x2="235" y2="260" stroke="#2e86de" stroke-width="2" stroke-dasharray="5 5"/>
<text x="270" y="194" class="tiny">raw point</text>
<text x="91" y="395" class="small">Nearest segments meet at one graph node.</text>
<text x="91" y="416" class="small">snap_ties = 1</text>

<rect x="480" y="80" width="370" height="350" rx="7" fill="#fbfcfc" stroke="#dfe5e8"/>
<text x="506" y="112" class="label">Geometric crossing without a shared vertex</text>
<line x1="535" y1="260" x2="795" y2="260" class="road"/>
<line x1="665" y1="150" x2="665" y2="365" class="road"/>
<!-- no graph-node dot at the intersection -->
<circle cx="690" cy="235" r="8" fill="#e67e22" opacity=".35"/>
<line x1="690" y1="235" x2="665" y2="260" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="690" y1="235" x2="690" y2="260" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 5"/>
<text x="686" y="213" class="tiny">raw point</text>
<text x="672" y="279" class="tiny">no shared vertex</text>
<text x="522" y="395" class="small">Two graph locations can occupy the same map coordinate.</text>
<text x="522" y="416" class="small">snap_ties = 2</text>

</svg>