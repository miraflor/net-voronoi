<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Cluster distance is the minimum network distance to any point in the cluster.</title>
<desc id="desc">Cluster distance is the minimum network distance to any point in the cluster.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#2d3436}
.small{font-size:14px} .label{font-size:16px;font-weight:600} .tiny{font-size:12px;fill:#65757c}
.road{stroke:#66757c;stroke-width:10;stroke-linecap:round;fill:none}
.thin{stroke:#66757c;stroke-width:3;fill:none} .dash{stroke-dasharray:7 6}
.node{stroke:#fff;stroke-width:2}
</style>

<text x="48" y="42" class="label">At the central junction x, a cluster means all of its member points</text>
<path d="M 120 275 L 760 275 M 420 70 L 420 455" class="road" opacity=".28"/>
<path d="M 420 275 L 120 275" stroke="#2e86de" stroke-width="8" fill="none" stroke-linecap="round" opacity=".55"/>
<path d="M 420 275 L 420 132" stroke="#2e86de" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M 420 275 L 760 275" stroke="#e67e22" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M 420 275 L 420 455" stroke="#27ae60" stroke-width="8" fill="none" stroke-linecap="round"/>
<circle cx="420" cy="275" r="11" fill="#fff" stroke="#2d3436" stroke-width="3"/>
<text x="438" y="280" class="label">x</text>
<circle cx="120" cy="275" r="8" fill="#2e86de" class="node"/><text x="82" y="257" class="small">A₁</text>
<circle cx="420" cy="132" r="8" fill="#2e86de" class="node"/><text x="439" y="136" class="small">A₂</text>
<circle cx="760" cy="275" r="8" fill="#e67e22" class="node"/><text x="776" y="280" class="small">B₁</text>
<circle cx="420" cy="455" r="8" fill="#27ae60" class="node"/><text x="439" y="460" class="small">C₁</text>
<text x="160" y="248" class="small" fill="#2e86de">8</text>
<text x="438" y="202" class="small" fill="#2e86de">7</text>
<text x="590" y="248" class="small" fill="#e67e22">10</text>
<text x="438" y="385" class="small" fill="#27ae60">9</text>
<rect x="80" y="420" width="300" height="68" rx="6" fill="#f7f9fa" stroke="#dfe5e8"/>
<text x="98" y="444" class="small">D(A,x) = min(8, 7) = 7</text>
<text x="98" y="466" class="small">D(B,x) = 10</text>
<text x="235" y="466" class="small">D(C,x) = 9</text>
<rect x="535" y="405" width="285" height="78" rx="6" fill="#eef6fb" stroke="#b8d9ec"/>
<text x="552" y="433" class="label">Winner at x: cluster A</text>
<text x="552" y="459" class="small">The cluster is not replaced by a center;</text>
<text x="552" y="478" class="small">its nearest member point supplies the distance.</text>

</svg>