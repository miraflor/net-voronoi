<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">The package pipeline separates exact network partitioning from optional surface rendering.</title>
<desc id="desc">The package pipeline separates exact network partitioning from optional surface rendering.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#2d3436}
.small{font-size:14px} .label{font-size:16px;font-weight:600} .tiny{font-size:12px;fill:#65757c}
.road{stroke:#66757c;stroke-width:10;stroke-linecap:round;fill:none}
.thin{stroke:#66757c;stroke-width:3;fill:none} .dash{stroke-dasharray:7 6}
.node{stroke:#fff;stroke-width:2}
</style>

<text x="48" y="42" class="label">From geospatial inputs to exact network cells and optional surface cells</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607078"/></marker></defs>
<g font-size="15">
<rect x="70" y="95" width="190" height="62" rx="7" fill="#f8fafb" stroke="#cfd9de"/><text x="105" y="121">roads + clustered points</text><text x="116" y="143" class="tiny">GeoDataFrames / files</text>
<line x1="260" y1="126" x2="332" y2="126" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="95" width="200" height="62" rx="7" fill="#f8fafb" stroke="#cfd9de"/><text x="378" y="121">build + snap + insert</text><text x="385" y="143" class="tiny">SpatialNetwork</text>
<line x1="540" y1="126" x2="612" y2="126" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="95" width="210" height="62" rx="7" fill="#eef6fb" stroke="#b8d9ec"/><text x="657" y="121">node partition D(v)</text><text x="659" y="143" class="tiny">global search + tie candidates</text>

<line x1="725" y1="157" x2="725" y2="222" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="230" width="210" height="62" rx="7" fill="#eef6fb" stroke="#b8d9ec"/><text x="661" y="256">exact edge boundary</text><text x="678" y="278" class="tiny">_edge_boundary</text>
<line x1="620" y1="261" x2="548" y2="261" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="338" y="230" width="202" height="62" rx="7" fill="#eaf5ed" stroke="#b9dbc1"/><text x="383" y="256">network_segments</text><text x="389" y="278" class="tiny">exact line pieces</text>
<line x1="338" y1="261" x2="266" y2="261" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="230" width="188" height="62" rx="7" fill="#eaf5ed" stroke="#b9dbc1"/><text x="119" y="256">network_cells</text><text x="103" y="278" class="tiny">pieces collected by cluster</text>

<line x1="439" y1="292" x2="439" y2="357" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="302" y="365" width="274" height="70" rx="7" fill="#fff7ea" stroke="#ead1a5"/><text x="339" y="393">optional polygon boundary</text><text x="333" y="417" class="tiny">grid → nearest anchor → exact cluster</text>
<line x1="576" y1="400" x2="648" y2="400" stroke="#607078" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="656" y="365" width="174" height="70" rx="7" fill="#fff7ea" stroke="#ead1a5"/><text x="684" y="393">surface_cells</text><text x="679" y="417" class="tiny">approximate 2-D layer</text>
</g>

</svg>