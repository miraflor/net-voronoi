<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Input points are snapped to the network and inserted as graph nodes.</title>
<desc id="desc">Input points are snapped to the network and inserted as graph nodes.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Segoe UI,Roboto,Arial,sans-serif;fill:#2d3436}
.small{font-size:14px} .label{font-size:16px;font-weight:600} .tiny{font-size:12px;fill:#65757c}
.road{stroke:#66757c;stroke-width:10;stroke-linecap:round;fill:none}
.thin{stroke:#66757c;stroke-width:3;fill:none} .dash{stroke-dasharray:7 6}
.node{stroke:#fff;stroke-width:2}
</style>

<text x="48" y="44" class="label">Raw clustered points → snapped network positions</text>
<path d="M 120 275 L 760 275 M 420 70 L 420 455" class="road"/>
<path d="M 700 90 L 825 145" class="road" stroke="#aeb9be"/>
<!-- raw points and connectors -->
<line x1="105" y1="245" x2="120" y2="275" stroke="#2e86de" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="105" cy="245" r="10" fill="#2e86de" opacity=".35"/><circle cx="120" cy="275" r="8" fill="#2e86de" class="node"/>
<text x="75" y="225" class="small">A₁</text>
<line x1="447" y1="132" x2="420" y2="132" stroke="#2e86de" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="447" cy="132" r="10" fill="#2e86de" opacity=".35"/><circle cx="420" cy="132" r="8" fill="#2e86de" class="node"/>
<text x="455" y="126" class="small">A₂</text>
<line x1="782" y1="247" x2="760" y2="275" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="782" cy="247" r="10" fill="#e67e22" opacity=".35"/><circle cx="760" cy="275" r="8" fill="#e67e22" class="node"/>
<text x="790" y="241" class="small">B₁</text>
<line x1="447" y1="468" x2="420" y2="455" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="447" cy="468" r="10" fill="#27ae60" opacity=".35"/><circle cx="420" cy="455" r="8" fill="#27ae60" class="node"/>
<text x="456" y="486" class="small">C₁</text>
<!-- insertion marker -->
<circle cx="420" cy="275" r="6" fill="#2d3436"/>
<text x="435" y="299" class="tiny">junction</text>
<path d="M 390 132 L 450 132" stroke="#fff" stroke-width="2"/>
<text x="493" y="153" class="tiny">A₂ lies in the interior of the original vertical road,</text>
<text x="493" y="171" class="tiny">so its snapped position becomes a true graph node.</text>
<text x="694" y="69" class="tiny">disconnected road component</text>
<text x="694" y="186" class="tiny">no source point → remains unassigned</text>
<circle cx="65" cy="475" r="7" fill="#2e86de"/><text x="80" y="480" class="small">cluster A</text>
<circle cx="185" cy="475" r="7" fill="#e67e22"/><text x="200" y="480" class="small">cluster B</text>
<circle cx="305" cy="475" r="7" fill="#27ae60"/><text x="320" y="480" class="small">cluster C</text>

</svg>